cas:
  username: "" # 在本机填写；有现成 Token 缓存时可暂留空
  password: ""
  device_id: null # 首次登录时自动生成，信任设备后请勿删除

auth:
  cache: .local/electricity/auth.json # 相对于 config.yaml，自动以 600 权限保存

# 空调用电，使用独立于宿舍普通用电的查询服务。
aircon:
  building: null
  floor: null # 不填写时从房间号推断，例如 405 -> 4 层
  room: null

# 宿舍普通用电。优先填写 list 返回的完整 value，例如 "服务器ID&显示名"。
# 也支持目录中唯一匹配的显示名/数字；三位房间号可从实际目录解析。
dorm_electricity:
  campus: "主校区"
  building: null
  floor: null
  room: null

# 后台监控：阈值单位为度，严格低于阈值才提醒；周期单位为秒。
daemon:
  threshold_kwh: "10"
  interval_seconds: 21600
  repeat_after_seconds: 86400
  query_timeout_seconds: 20
  history: .local/electricity/history.sqlite3

# 填入本机凭据后将需要的渠道 enabled 改为 true；daemon 至少需要一个启用渠道。
# 渠道 id 必须唯一，用于独立记录提醒冷却和发送状态。
notifications:
  channels:
    - id: pushdeer-main
      type: pushdeer
      enabled: false
      pushkey: ""
      endpoint: "https://api2.pushdeer.com" # 自架服务可替换地址
      timeout_seconds: 10
    - id: webhook-main
      type: webhook
      enabled: false
      url: ""
      headers: {} # 例如 Authorization: "Bearer 本机凭据"
      timeout_seconds: 10
